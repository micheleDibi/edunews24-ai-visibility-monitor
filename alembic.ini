[alembic]
script_location = alembic
prepend_sys_path = .
# `sqlalchemy.url` non e' qui di proposito: viene iniettato da
# `alembic/env.py` leggendo MONITOR_DB_URL dalle Settings, cosi' esiste un solo
# posto in cui la stringa di connessione e' configurata.
file_template = %%(rev)s_%%(slug)s
timezone = UTC

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
