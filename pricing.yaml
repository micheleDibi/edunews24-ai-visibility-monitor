# =============================================================================
# Listini dei provider — TUTTI I PREZZI IN USD
# =============================================================================
# Il database e la dashboard sono in EUR: la conversione usa USD_EUR_RATE dal
# .env. Nessuna chiamata a un servizio di cambio a runtime — sarebbe una
# dipendenza esterna in piu' per una precisione che qui non serve.
#
# Aggiorna `updated` ogni volta che tocchi un numero: se questa data invecchia
# oltre PRICING_MAX_AGE_DAYS (default 90) l'applicazione lo scrive nei log a
# ogni avvio. Un kill switch che calcola su prezzi di un anno fa non protegge.
#
# Verificato sulle pagine ufficiali il 2026-07-30. Vedi docs/providers.md per
# le fonti puntuali e le trappole di fatturazione.
# =============================================================================

updated: 2026-07-30

providers:

  openai:
    source_url: https://developers.openai.com/api/docs/pricing
    # Il tool di web search e' fatturato A RICERCA, non a richiesta: una
    # singola domanda su un modello con reasoning puo' farne diverse. Si conta
    # solo `action.type == "search"`, che e' l'unica documentata come a
    # pagamento (open_page e find_in_page no).
    per_search_usd: 0.01
    models:
      gpt-5.6-luna:  {input_per_1m: 1.00,  output_per_1m: 6.00}
      gpt-5.6-terra: {input_per_1m: 2.50,  output_per_1m: 15.00}
      gpt-5.6-sol:   {input_per_1m: 5.00,  output_per_1m: 30.00}
      gpt-5.4-nano:  {input_per_1m: 0.20,  output_per_1m: 1.25}
      gpt-5.4-mini:  {input_per_1m: 0.75,  output_per_1m: 4.50}
      # Deprecato: spegnimento annunciato per l'11 dicembre 2026.
      gpt-5-nano:    {input_per_1m: 0.05,  output_per_1m: 0.40}
      gpt-5-mini:    {input_per_1m: 0.25,  output_per_1m: 2.00}

  perplexity:
    source_url: https://docs.perplexity.ai/docs/getting-started/pricing
    # NOTA: Perplexity restituisce `usage.cost.total_cost`, il costo esatto
    # della chiamata con la fascia per richiesta gia' inclusa. Quando c'e' si
    # usa quello e questo listino non viene nemmeno letto: ricalcolare a mano
    # una tariffa a fasce e' sbagliato per costruzione. Questi numeri servono
    # solo come ripiego se il campo manca.
    request_fee_usd_by_context:
      sonar:     {low: 0.005, medium: 0.008, high: 0.012}
      sonar-pro: {low: 0.006, medium: 0.010, high: 0.014}
    models:
      sonar:               {input_per_1m: 1.00, output_per_1m: 1.00}
      sonar-pro:           {input_per_1m: 3.00, output_per_1m: 15.00}
      sonar-reasoning-pro: {input_per_1m: 2.00, output_per_1m: 8.00}

  anthropic:
    source_url: https://platform.claude.com/docs/en/about-claude/pricing
    # $10 per 1.000 ricerche. Il conteggio esatto arriva da
    # `usage.server_tool_use.web_search_requests`. Una ricerca andata in errore
    # non viene fatturata, e il parser la salta.
    per_search_usd: 0.01
    models:
      # Prezzo introduttivo fino al 2026-08-31, poi 3.00 / 15.00: da rivedere
      # a settembre 2026.
      claude-sonnet-5: {input_per_1m: 2.00,  output_per_1m: 10.00}
      claude-opus-5:   {input_per_1m: 5.00,  output_per_1m: 25.00}
      claude-haiku-4-5: {input_per_1m: 1.00, output_per_1m: 5.00}

  gemini:
    source_url: https://ai.google.dev/gemini-api/docs/pricing
    # ATTENZIONE all'unita', che cambia per generazione:
    #  - Gemini 2.5: per PROMPT con grounding ($35/1000), prevedibile.
    #  - Gemini 3.x: per SINGOLA QUERY di ricerca ($14/1000), quindi una
    #    domanda che ne fa cinque costa cinque volte.
    # Qui si registra la tariffa A PAGAMENTO ignorando la quota gratuita (1.500
    # richieste al giorno su 2.5, che coprirebbero interamente le nostre): il
    # kill switch deve sovrastimare, non sottostimare.
    per_request_usd: 0.035
    per_search_usd: 0.014
    models:
      gemini-2.5-flash: {input_per_1m: 0.30, output_per_1m: 2.50}
      gemini-2.5-pro:   {input_per_1m: 1.25, output_per_1m: 10.00}
      gemini-3.6-flash: {input_per_1m: 1.50, output_per_1m: 7.50}
